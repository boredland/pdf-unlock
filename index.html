<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>PDF Unlock</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f5f5f7;
        --card-bg: #fff;
        --text: #1d1d1f;
        --muted: #86868b;
        --border: #d2d2d7;
        --divider: #e8e8ed;
        --info-bg: #f5f5f7;
        --accent: #0071e3;
        --accent-hover: #0077ed;
        --green: #34c759;
        --green-hover: #2db84e;
        --red: #ff3b30;
        --drop-hover-bg: #f0f5ff;
        --drop-file-bg: #f0faf3;
        --shadow: rgba(0, 0, 0, 0.08);
        --corner-fill: #1d1d1f;
        --corner-color: #fff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --card-bg: #2c2c2e;
          --text: #f5f5f7;
          --muted: #98989d;
          --border: #48484a;
          --divider: #38383a;
          --info-bg: #38383a;
          --accent: #0a84ff;
          --accent-hover: #409cff;
          --green: #30d158;
          --green-hover: #25a944;
          --red: #ff453a;
          --drop-hover-bg: rgba(10, 132, 255, 0.1);
          --drop-file-bg: rgba(48, 209, 88, 0.1);
          --shadow: rgba(0, 0, 0, 0.3);
          --corner-fill: #f5f5f7;
          --corner-color: #1c1c1e;
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .github-corner svg {
        fill: var(--corner-fill);
        color: var(--corner-color);
        position: fixed;
        top: 0;
        right: 0;
        border: 0;
      }

      .github-corner .octo-arm {
        transform-origin: 130px 106px;
      }

      .github-corner:hover .octo-arm {
        animation: octocat-wave 560ms ease-in-out;
      }

      @keyframes octocat-wave {
        0%,
        100% {
          transform: rotate(0);
        }
        20%,
        60% {
          transform: rotate(-25deg);
        }
        40%,
        80% {
          transform: rotate(10deg);
        }
      }

      .card {
        background: var(--card-bg);
        border-radius: 16px;
        box-shadow: 0 2px 12px var(--shadow);
        padding: 2.5rem;
        max-width: 480px;
        width: 100%;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        color: var(--muted);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }

      .drop-zone {
        border: 2px dashed var(--border);
        border-radius: 12px;
        padding: 2rem 1rem;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        margin-bottom: 1rem;
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: var(--accent);
        background: var(--drop-hover-bg);
      }

      .drop-zone.has-file {
        border-color: var(--green);
        background: var(--drop-file-bg);
      }

      .drop-zone p {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .drop-zone .filename {
        color: var(--text);
        font-weight: 500;
        word-break: break-all;
      }

      .file-input {
        display: none;
      }

      .password-row {
        margin-bottom: 1rem;
      }

      .password-row label {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }

      .password-row input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
        outline: none;
        background: var(--bg);
        color: var(--text);
        transition: border-color 0.2s;
      }

      .password-row input:focus {
        border-color: var(--accent);
      }

      .btn {
        width: 100%;
        padding: 0.7rem;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-download {
        background: var(--green);
        color: #fff;
        margin-top: 0.75rem;
        text-decoration: none;
        display: block;
        text-align: center;
      }

      .btn-download:hover {
        background: var(--green-hover);
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        text-align: center;
        min-height: 1.25rem;
      }

      .status.error {
        color: var(--red);
      }

      .status.success {
        color: var(--green);
      }

      .status.loading {
        color: var(--muted);
      }

      .encryption-info {
        background: var(--info-bg);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.8rem;
        line-height: 1.6;
      }

      .encryption-info .label {
        color: var(--muted);
      }

      .encryption-info .value {
        color: var(--text);
        font-weight: 500;
      }

      .encryption-info .not-encrypted {
        color: var(--green);
        font-weight: 500;
      }

      .encryption-info .restricted {
        color: var(--red);
      }

      .encryption-info .allowed {
        color: var(--green);
      }

      .privacy {
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid var(--divider);
        font-size: 0.75rem;
        color: var(--muted);
        text-align: center;
        line-height: 1.5;
      }

      footer {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: var(--muted);
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <a
      href="https://github.com/boredland/pdf-unlock"
      class="github-corner"
      aria-label="View source on GitHub"
      target="_blank"
      rel="noopener"
    >
      <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
        <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
        <path
          d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2"
          fill="currentColor"
          style="transform-origin: 130px 106px"
          class="octo-arm"
        ></path>
        <path
          d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C## 194.5,69.0 197.7,73.2 200.1,77.6 C## 213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C## 157.9,116.9 156.7,120.9 152.7,124.9 L## 141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z"
          fill="currentColor"
        ></path>
      </svg>
    </a>

    <div class="card">
      <h1>PDF Unlock</h1>
      <p class="subtitle">Remove password protection from PDF files</p>

      <div class="drop-zone" id="drop-zone">
        <p>Drop a PDF here or click to select</p>
      </div>
      <input
        type="file"
        accept=".pdf,application/pdf"
        class="file-input"
        id="file-input"
      />

      <div class="encryption-info" id="encryption-info" hidden></div>

      <div class="password-row" hidden>
        <label for="password">Password</label>
        <input type="password" id="password" />
      </div>

      <button class="btn btn-primary" id="unlock-btn" disabled>Unlock</button>

      <div class="status" id="status"></div>
      <div id="download-container"></div>

      <div class="privacy">
        Your files never leave your device. All processing runs locally in your
        browser using WebAssembly.
      </div>
    </div>

    <footer>
      Powered by
      <a
        href="https://github.com/neslinesli93/qpdf-wasm"
        target="_blank"
        rel="noopener"
        >qpdf-wasm</a
      >
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
