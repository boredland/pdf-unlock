<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Unlock</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }

      .card {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 2.5rem;
        max-width: 480px;
        width: 100%;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .subtitle {
        color: #86868b;
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }

      .drop-zone {
        border: 2px dashed #d2d2d7;
        border-radius: 12px;
        padding: 2rem 1rem;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        margin-bottom: 1rem;
      }

      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: #0071e3;
        background: #f0f5ff;
      }

      .drop-zone.has-file {
        border-color: #34c759;
        background: #f0faf3;
      }

      .drop-zone p {
        color: #86868b;
        font-size: 0.9rem;
      }

      .drop-zone .filename {
        color: #1d1d1f;
        font-weight: 500;
        word-break: break-all;
      }

      .file-input {
        display: none;
      }

      .password-row {
        margin-bottom: 1rem;
      }

      .password-row label {
        display: block;
        font-size: 0.8rem;
        color: #86868b;
        margin-bottom: 0.35rem;
      }

      .password-row input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid #d2d2d7;
        border-radius: 8px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .password-row input:focus {
        border-color: #0071e3;
      }

      .btn {
        width: 100%;
        padding: 0.7rem;
        border: none;
        border-radius: 10px;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
      }

      .btn-primary {
        background: #0071e3;
        color: #fff;
      }

      .btn-primary:hover:not(:disabled) {
        background: #0077ed;
      }

      .btn-primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-download {
        background: #34c759;
        color: #fff;
        margin-top: 0.75rem;
        text-decoration: none;
        display: block;
        text-align: center;
      }

      .btn-download:hover {
        background: #2db84e;
      }

      .status {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        text-align: center;
        min-height: 1.25rem;
      }

      .status.error {
        color: #ff3b30;
      }

      .status.success {
        color: #34c759;
      }

      .status.loading {
        color: #86868b;
      }

      .encryption-info {
        background: #f5f5f7;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin-bottom: 1rem;
        font-size: 0.8rem;
        line-height: 1.6;
        display: none;
      }

      .encryption-info.visible {
        display: block;
      }

      .encryption-info .label {
        color: #86868b;
      }

      .encryption-info .value {
        color: #1d1d1f;
        font-weight: 500;
      }

      .encryption-info .not-encrypted {
        color: #34c759;
        font-weight: 500;
      }

      .encryption-info .restricted {
        color: #ff3b30;
      }

      .encryption-info .allowed {
        color: #34c759;
      }

      .privacy {
        margin-top: 1.25rem;
        padding-top: 1rem;
        border-top: 1px solid #e8e8ed;
        font-size: 0.75rem;
        color: #86868b;
        text-align: center;
        line-height: 1.5;
      }

      footer {
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: #86868b;
      }

      footer a {
        color: #0071e3;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>PDF Unlock</h1>
      <p class="subtitle">Remove password protection from PDF files</p>

      <div class="drop-zone" id="drop-zone">
        <p>Drop a PDF here or click to select</p>
      </div>
      <input
        type="file"
        accept=".pdf,application/pdf"
        class="file-input"
        id="file-input"
      />

      <div class="encryption-info" id="encryption-info"></div>

      <div class="password-row">
        <label for="password"
          >Password <span style="opacity: 0.7">(if required)</span></label
        >
        <input
          type="password"
          id="password"
          placeholder="Leave empty if not needed"
        />
      </div>

      <button class="btn btn-primary" id="unlock-btn" disabled>Unlock</button>

      <div class="status" id="status"></div>
      <div id="download-container"></div>

      <div class="privacy">
        Your files never leave your device. All processing runs locally in your
        browser using WebAssembly.
      </div>
    </div>

    <footer>
      Powered by
      <a
        href="https://github.com/neslinesli93/qpdf-wasm"
        target="_blank"
        rel="noopener"
        >qpdf-wasm</a
      >
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
